AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AI Personal Finance Advisor - Lambda Functions + S3 Frontend

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bedrock-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - "arn:aws:bedrock:*::foundation-model/*"

  FinancialDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/financial_dashboard/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  BudgetMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/budget_monitor/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  AIFinancialRecommendationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/ai_financial_recommendation/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  FinancialHealthReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/financial_health_report/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  SubscriptionReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/subscription_reminder/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  AIFinancialAdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/ai_financial_advisor/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  FinancialDashboardUrl:
    Value: !GetAtt FinancialDashboardFunctionUrl.FunctionUrl
  BudgetMonitorUrl:
    Value: !GetAtt BudgetMonitorFunctionUrl.FunctionUrl
  AIFinancialRecommendationUrl:
    Value: !GetAtt AIFinancialRecommendationFunctionUrl.FunctionUrl
  FinancialHealthReportUrl:
    Value: !GetAtt FinancialHealthReportFunctionUrl.FunctionUrl
  SubscriptionReminderUrl:
    Value: !GetAtt SubscriptionReminderFunctionUrl.FunctionUrl
  AIFinancialAdvisorUrl:
    Value: !GetAtt AIFinancialAdvisorFunctionUrl.FunctionUrl
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket
